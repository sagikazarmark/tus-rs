[graph]
all-features = true

[advisories]
# OpenDAL 0.57.0 pins quick-xml to ^0.39.3 and no crates.io release
# currently allows the fixed quick-xml >=0.41.0 line.
ignore = [
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",

  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
