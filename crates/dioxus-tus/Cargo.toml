[package]
name = "dioxus-tus"
description = "Headless TUS resumable-upload hook for Dioxus web apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The hook, transport, and handle APIs are wasm-only, so docs must be built for
# wasm32 to resolve their intra-doc links.
[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]

[dependencies]
# Referenced by path rather than through the workspace table: this crate is the
# only wasm consumer and needs tus-client *without* its default native reqwest
# transport, and Cargo cannot toggle `default-features` on an inherited dep.
tus-client = { path = "../tus-client", version = "0.0.1", default-features = false }

async-trait = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7", features = ["web"] }
gloo-net = { version = "0.7", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "DataTransfer", "DragEvent", "File", "FileList", "FilePropertyBag", "HtmlInputElement", "Storage", "Window"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
