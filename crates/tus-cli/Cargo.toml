[package]
name = "tus-cli"
description = "Command-line client for TUS uploads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tus"
path = "src/main.rs"

[dependencies]
tus-client = { workspace = true }

anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["env", "json", "toml", "yaml"] }
indicatif = "0.17"
parse-size = "1.1"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = ["full"] }
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
tus-axum = { workspace = true }
tus-client = { workspace = true }
tus-protocol = { workspace = true, features = ["full-native", "storage-memory", "state-memory"] }

axum = { workspace = true }
tempfile = { workspace = true }
