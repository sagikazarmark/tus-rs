[package]
name = "tus-hook-http"
description = "HTTP hook for the TUS protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tus-protocol = { workspace = true }

async-trait = { workspace = true }
fastrand = { workspace = true }
hmac = "0.13"
reqwest = { workspace = true, default-features = false, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }

[features]
# reqwest's default features include its default TLS stack, which on
# reqwest 0.13 is rustls (aws-lc-rs) with the platform certificate verifier.
default = ["reqwest/default"]
# TLS passthrough for builds that disable default features (which drops the
# rustls TLS stack above): re-add rustls, or opt into native-tls (OpenSSL /
# system TLS) instead.
reqwest-native-tls = ["reqwest/native-tls"]
reqwest-rustls = ["reqwest/rustls"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
