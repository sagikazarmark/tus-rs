[package]
name = "tus-axum"
version.workspace = true
description = "axum integration for the tus-protocol TUS resumable upload implementation"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tus", "upload", "resumable", "axum", "http"]
categories = ["web-programming::http-server", "asynchronous"]

[features]
default = []

[dependencies]
tus-protocol = { workspace = true }

axum = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }

[dev-dependencies]
tus-protocol = { workspace = true, features = [
    "checksum",
    "lock-file",
    "lock-memory",
    "state-file",
    "state-memory",
    "storage-file",
    "storage-memory",
] }

async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
criterion = { version = "0.8", features = ["async_tokio"] }
futures = { workspace = true }
proptest = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test = { workspace = true }
tower = { workspace = true, features = ["util"] }

[[bench]]
name = "hot_path"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
