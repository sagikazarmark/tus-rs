[package]
name = "tus-client"
description = "Async TUS client for resumable uploads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tus-protocol = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, default-features = false, optional = true }
reqwest-middleware = { workspace = true, default-features = false, optional = true }
thiserror = { workspace = true }
url = { workspace = true }

# tokio's `fs`/`io-util`/`time`/`rt` features all gate on functionality used
# only on native (FS-backed methods, native retry sleep, JoinSet). Keeping
# the dep cfg-gated keeps it (and its non-wasm transitive crates) out of
# wasm consumer dep graphs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tus-axum = { workspace = true }
tus-protocol = { workspace = true, features = ["full-native", "storage-memory", "state-memory"] }

axum = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["checksum", "transport-reqwest", "reqwest?/default"]
checksum = ["tus-protocol/checksum"]
local-futures = []
source-file = []
transport-reqwest = ["dep:bytes", "dep:http-body-util", "dep:reqwest"]
transport-reqwest-middleware = ["transport-reqwest", "dep:reqwest-middleware"]

[[example]]
name = "upload_file"
required-features = ["source-file", "transport-reqwest"]
