[package]
name = "tus-client"
description = "Async TUS client for resumable uploads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
tus-protocol = { workspace = true }

async-trait = { workspace = true }
base64 = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, default-features = false, optional = true }
reqwest-middleware = { workspace = true, default-features = false, optional = true }
thiserror = { workspace = true }
url = { workspace = true }

# tokio's `time`/`rt` features gate on functionality used only on native
# (native retry sleep, JoinSet); `fs`/`io-util` are added by the
# `source-file` feature. Keeping the dep cfg-gated keeps it (and its
# non-wasm transitive crates) out of wasm consumer dep graphs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bytes = { workspace = true, optional = true }
fastrand = { workspace = true }
http-body-util = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tus-axum = { workspace = true }
tus-protocol = { workspace = true, features = ["lock-memory", "state-memory", "storage-memory"] }

axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4", features = ["futures"] }
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
# `reqwest?/default` pulls reqwest's default TLS stack, which on reqwest 0.13
# is rustls (aws-lc-rs) with the platform certificate verifier.
default = ["checksum", "transport-reqwest", "reqwest?/default"]
checksum = ["tus-protocol/checksum"]
# TLS passthrough for builds that disable default features (which drops the
# rustls TLS stack above): re-add rustls, or opt into native-tls (OpenSSL /
# system TLS) instead.
reqwest-native-tls = ["reqwest?/native-tls"]
reqwest-rustls = ["reqwest?/rustls"]
source-file = ["tokio/fs", "tokio/io-util"]
transport-reqwest = ["dep:bytes", "dep:http-body-util", "dep:reqwest"]
transport-reqwest-middleware = ["transport-reqwest", "dep:reqwest-middleware"]

[[example]]
name = "upload_file"
required-features = ["source-file", "transport-reqwest"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
