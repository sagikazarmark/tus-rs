[package]
name = "tus-storage-opendal"
description = "OpenDAL storage backend for TUS resumable uploads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
opendal = { workspace = true }
tus-protocol = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
opendal = { workspace = true, features = ["services-fs"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tus-protocol = { workspace = true, features = ["conformance-storage"] }
