[package]
name = "tus-protocol"
description.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
fs2 = { version = "0.4", optional = true }
futures = { workspace = true }
http = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

# Optional - native runtime
tokio = { workspace = true, optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }

# Optional - Checksum
crc32fast = { version = "1", optional = true }
md5 = { version = "0.8", optional = true }
sha1 = { version = "0.11", optional = true }
sha2 = { version = "0.11", optional = true }

# On wasm32, uuid's v4 RNG needs an explicit
# randomness source. The `js` feature routes it through js-sys'
# crypto.getRandomValues(), which workerd provides.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["v4", "js"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
default = []

# Platform features
native = ["tokio", "tokio-util"]

# Conformance suites
conformance-lock = ["tokio/time"]
conformance-state = []
conformance-storage = []

# Storage implementations
storage-file = ["native", "tokio/fs", "tokio/io-util"]
storage-memory = []

# State storage implementations
state-file = ["native", "tokio/fs", "tokio/io-util"]
state-memory = []

# Locking implementations
lock-file = ["native", "fs2", "tokio/fs", "tokio/time"]
lock-memory = ["native", "tokio/sync", "tokio/time"]

# Checksum implementations
checksum = ["crc32fast", "md5", "sha1", "sha2"]

# Internal-only hooks for fuzz harnesses.
fuzzing = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
