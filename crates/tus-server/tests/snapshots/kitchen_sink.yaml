# Canonical YAML equivalent of kitchen_sink.toml. Kept in step
# byhand so reviewers can see both forms together.

addr: "unix:/tmp/tus-kitchen-sink-yaml.sock"
storage:
  uri: "fs://"
  root: "./uploads-ks"
state_dir: "./state-ks"
max_size: 104857600
max_chunk_size: 268435456
base_path: "/files"
base_url: "https://tus.example.com"
respect_forwarded_headers: false

all_extensions: true
disable_checksum_trailer: false
disable_concatenation_unfinished: false
disable_download: false

cleanup: true
expiration: 3600
expiration_scan_interval: 60

shutdown_grace: 30
drain_delay: 5

cors: false
cors_origins:
  - "https://app.example.com"
  - "https://admin.example.com"

auth_token:
  - "token-one"
  - "token-two"

max_request_body_bytes: 1073741824
request_body_read_timeout: 60

log_format: "text"

hook:
  url: "http://127.0.0.1:65535/hooks"
  timeout: 30
  header:
    - "Authorization: Bearer webhook-secret"
  retry: false
  max_retries: 3
  signing_secret: "hmac-secret"
