[package]
name = "tus-server"
version.workspace = true
description = "TUS resumable upload server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tus", "upload", "resumable", "http", "server"]
categories = ["web-programming::http-server", "asynchronous"]

[[bin]]
name = "tus-server"
path = "src/main.rs"

[features]
default = ["opendal-fs"]
opendal-fs = ["tus-storage-opendal/services-fs"]
opendal-s3 = ["tus-storage-opendal/services-s3"]

[dependencies]
tus-axum = { workspace = true }
tus-hook-http = { workspace = true }
tus-protocol = { workspace = true, features = ["checksum", "lock-memory", "state-file"] }
tus-storage-opendal = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
figment = { workspace = true, features = ["toml", "yaml"] }
http-body-util = { workspace = true }
humantime = { workspace = true }
hyper-util = { version = "0.1", features = ["http1", "http2", "server", "server-auto", "server-graceful", "tokio"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["limit", "timeout"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tus-client = { workspace = true }

reqwest = { workspace = true, default-features = false, features = ["rustls"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
