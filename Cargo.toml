[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
description = "TUS resumable upload protocol implementation for Rust"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/tus-rs"
homepage = "https://github.com/sagikazarmark/tus-rs"
keywords = ["tus", "upload", "resumable", "http", "server"]
categories = ["web-programming::http-server", "network-programming", "asynchronous"]

[workspace.dependencies]
dioxus-tus = { path = "crates/dioxus-tus", version = "0.0.1" }
tus-axum = { path = "crates/tus-axum", version = "0.0.1" }
tus-cli = { path = "crates/tus-cli", version = "0.0.1" }
tus-client = { path = "crates/tus-client", version = "0.0.1" }
tus-hook-http = { path = "crates/tus-hook-http", version = "0.0.1" }
tus-protocol = { path = "crates/tus-protocol", version = "0.0.1" }
tus-storage-opendal = { path = "crates/tus-storage-opendal", version = "0.0.1" }

anyhow = "1"
async-trait = "0.1"
# Default features (form/json/query/matched-path/original-uri/tower-log/...)
# are not used anywhere in the workspace. `http1` + `tokio` are all that
# `axum::serve` needs; enable only those.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4" }
fastrand = "2"
figment = { version = "0.10" }
futures = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
humantime = "2"
opendal = { version = "0.57", default-features = false }
percent-encoding = "2"
proptest = "1"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1" }
tokio-test = "0.4"
tower = { version = "0.5" }
tower-http = { version = "0.7" }
tracing = "0.1"
url = "2"
uuid = { version = "1" }

[workspace.metadata.release]
sign-commit = true
sign-tag = true
shared-version = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
