[package]
name = "demo-service-worker"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["async-await", "std"] }
js-sys = "0.3"
rexie = "0.6"
serde_json = "1"
thiserror = "2"
tus-protocol = { path = "../../crates/tus-protocol" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.6"
web-sys = { version = "0.3", features = ["Headers", "ReadableStream", "Request", "Response", "ResponseInit", "ServiceWorkerGlobalScope", "ServiceWorkerRegistration", "Url", "WorkerGlobalScope"] }
