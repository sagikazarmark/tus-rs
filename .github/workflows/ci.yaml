name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# `--all-features` is not usable in this workspace: `local-futures` (non-Send
# futures for single-threaded runtimes like Cloudflare Workers) is mutually
# exclusive with the `native` / `Send`-bound features used by tus-axum and
# the memory backends. Each job below tests two configurations:
#
# - Native:        full workspace, every feature except `local-futures`.
# - local-futures: tus-protocol only (tus-axum requires Send via axum).
env:
  NATIVE_FEATURES: tus-protocol/full-native,tus-protocol/storage-memory,tus-protocol/state-memory,tus-protocol/fuzzing
  LOCAL_FEATURES: local-futures,storage-memory,state-memory,checksum

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Build (native)
        run: cargo build --workspace --all-targets --features "$NATIVE_FEATURES"

      - name: Build (local-futures)
        run: cargo build -p tus-protocol --all-targets --no-default-features --features "$LOCAL_FEATURES"

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Run tests (native)
        run: cargo test --workspace --features "$NATIVE_FEATURES"

      - name: Run tests (local-futures)
        run: cargo test -p tus-protocol --no-default-features --features "$LOCAL_FEATURES"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Build documentation
        run: cargo doc --workspace --no-deps --features "$NATIVE_FEATURES"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Run fmt
        run: cargo fmt -- --check

      - name: Run clippy (native)
        run: cargo clippy --workspace --all-targets --features "$NATIVE_FEATURES" -- -D warnings

      - name: Run clippy (local-futures)
        run: cargo clippy -p tus-protocol --all-targets --no-default-features --features "$LOCAL_FEATURES" -- -D warnings

  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  deny:
    name: Deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Rust
        uses: ./.github/actions/rust/

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny
        run: cargo deny check
